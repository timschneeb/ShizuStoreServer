services:
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: monitoring-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - /home/tim/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/tim/monitoring/prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    mem_limit: 512m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: monitoring-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: monitoring-grafana
    # Inline environment: Portainer resolves env_file paths inside its own
    # container, where /home/tim does not exist. Supply the value via a .env
    # next to this file (CLI) or the stack environment variables (Portainer).
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Alert notifications link back to Grafana. The default root URL points
      # at localhost, whose host has no dot, and Telegram drops anchor
      # entities to such hosts, leaving plain unclickable text.
      GF_SERVER_ROOT_URL: https://grafana.timschneeberger.me
      GF_SERVER_DOMAIN: grafana.timschneeberger.me
      # Soft heap cap: at the cgroup limit the Go runtime thrashes instead of
      # returning 200s. 512m hit that wall under a 5s-refresh dashboard.
      GOMEMLIMIT: 900MiB
    ports:
      - 3001:3000
    volumes:
      - /home/tim/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /home/tim/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 1g
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
